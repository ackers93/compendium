# fly.toml app configuration file generated for compendium on 2025-08-26T15:41:00-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'compendium'
primary_region = 'sjc'
console_command = '/rails/bin/rails console'

[build]

[deploy]
  release_command = './bin/rails db:prepare'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Health check against Rails' built-in /up endpoint.
[[http_service.checks]]
  grace_period = "120s"
  interval = "15s"
  timeout = "10s"
  method = "GET"
  path = "/up"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
